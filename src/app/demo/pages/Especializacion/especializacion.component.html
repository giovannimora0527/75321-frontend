<div class="container mt-4">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Gestión de Especializaciones</h4>
      <button
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#modalCrear">
        <i class="bi bi-plus-circle"></i> Nueva Especialización
      </button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-striped">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Código</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let esp of especializacionList">
              <td>{{ esp.id }}</td>
              <td><span class="badge bg-info">{{ esp.codigoEspecializacion }}</span></td>
              <td>{{ esp.nombre }}</td>
              <td>{{ esp.descripcion }}</td>
              <td>
                <button
                  class="btn btn-outline-primary"
                  data-bs-toggle="modal"
                  data-bs-target="#modalEditar"
                  (click)="seleccionarParaEditar(esp)"
                  title="Editar especialización">
                  <i class="fa fa-edit"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="especializacionList.length === 0">
              <td colspan="5" class="text-center text-muted">
                No hay especializaciones disponibles.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Crear -->
<div class="modal fade" id="modalCrear" tabindex="-1" aria-labelledby="modalCrearLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCrearLabel">Nueva Especialización</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="codigo" class="form-label">Código</label>
            <input
              type="text"
              class="form-control"
              id="codigo"
              [(ngModel)]="nuevaEspecializacion.codigoEspecializacion"
              name="codigoEspecializacion"
              maxlength="10"
              required>
          </div>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              [(ngModel)]="nuevaEspecializacion.nombre"
              name="nombre"
              maxlength="100"
              required>
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea
              class="form-control"
              id="descripcion"
              rows="3"
              [(ngModel)]="nuevaEspecializacion.descripcion"
              name="descripcion"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearEspecializacion()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Editar -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalEditarLabel">Editar Especialización</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" *ngIf="especializacionSeleccionada">
        <form>
          <div class="mb-3">
            <label for="codigoEdit" class="form-label">Código</label>
            <input
              type="text"
              class="form-control"
              id="codigoEdit"
              [(ngModel)]="especializacionSeleccionada.codigoEspecializacion"
              name="codigoEspecializacion"
              maxlength="10"
              required>
          </div>
          <div class="mb-3">
            <label for="nombreEdit" class="form-label">Nombre</label>
            <input
              type="text"
              class="form-control"
              id="nombreEdit"
              [(ngModel)]="especializacionSeleccionada.nombre"
              name="nombre"
              maxlength="100"
              required>
          </div>
          <div class="mb-3">
            <label for="descripcionEdit" class="form-label">Descripción</label>
            <textarea
              class="form-control"
              id="descripcionEdit"
              rows="3"
              [(ngModel)]="especializacionSeleccionada.descripcion"
              name="descripcion"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="actualizarEspecializacion()">Actualizar</button>
      </div>
    </div>
  </div>
</div>
