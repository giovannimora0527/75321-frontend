<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="row align-items-center">
        <div class="col-lg-7">
          <h3 class="mb-0">
            <i class="fa fa-users"></i>
            &nbsp;Lista de usuarios
          </h3>
          <small>Estos son los usuarios registrados en el sistema.</small>
        </div>
        <div class="col-lg-5 text-end">
          <button class="btn btn-outline-primary" (click)="abrirNuevoUsuario()">Nuevo Usuario</button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Nombre de usuario</th>
              <th>Rol</th>
              <th>Fecha de creacion</th>
              <th>Activo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody *ngIf="usuariosList.length > 0">
            <tr *ngFor="let usuario of usuariosList">
              <td>{{ usuario.id }}</td>
              <td>{{ usuario.username }}</td>
              <td>{{ usuario.rol }}</td>
              <td>{{ usuario.fechaCreacion }}</td>
              <td>
                <i class="fa" [ngClass]="usuario.activo === true ? 'fa-check text-success' : 'fa-times text-danger'" aria-hidden="true"></i>
              </td>
              <td>
                <button class="btn btn-outline-primary" (click)="abrirEditarUsuario(usuario)">
                  <i class="fa fa-edit"></i>Editar</button>
              </td>
            </tr>
          </tbody>
          <tbody *ngIf="usuariosList.length === 0">
            <tr>
              <td colspan="6" class="text-center">No hay usuarios disponibles.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Nuevo Usuario -->
<div class="modal fade" id="modalCrearUsuario" tabindex="-1" aria-labelledby="modalCrearUsuarioLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCrearUsuarioLabel"> {{ titleModal }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarUsuario()">{{titleBoton}}</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Abrir modal al hacer clic en "Nuevo Usuario"
  document.querySelector('.btn-outline-primary').addEventListener('click', function () {
    var modal = new bootstrap.Modal(document.getElementById('nuevoUsuarioModal'));
    modal.show();
  });
</script>
