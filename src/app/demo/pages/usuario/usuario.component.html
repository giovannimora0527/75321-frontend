<div class="card">
  <div class="card-title">
    <div class="row">
      <div class="col-lg-12">
        <h5 style="margin-left: 10px">Lista de usuarios</h5>
        <small>Estos son los usuarios registrados en el sistema.</small>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nombre de usuario</th>
            <th>Rol</th>
            <th>Fecha de creacion</th>
            <th>Activo</th>
          </tr>
        </thead>
        <tbody *ngIf="usuariosList.length > 0">
          <tr *ngFor="let u of usuariosList">
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.rol }}</td>
            <td>{{ u.fechaCreacion }}</td>
            <td>{{ u.activo === true ? 'Activo' : 'Inactivo' }}</td>
          </tr>
        </tbody>
        <tbody *ngIf="usuariosList.length === 0">
          <tr>
            <td colspan="5" class="text-center">No hay usuarios disponibles.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
