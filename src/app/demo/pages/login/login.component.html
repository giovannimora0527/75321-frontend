<div class="login-page">
	<div class="login-card" role="main" aria-labelledby="loginTitle">
		<header class="login-header">
			<h1 id="loginTitle">Acceder</h1>
			<p class="subtitle">Ingrese su usuario y contraseña</p>
		</header>

		<form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form" novalidate>
			<div class="form-group">
				<label for="username">Usuario</label>
				<input id="username" type="text" formControlName="username" placeholder="nombre.usuario"
							 [attr.aria-invalid]="f['username'].invalid && f['username'].touched" />
				<small class="error" *ngIf="f['username'].touched && f['username'].invalid">
					<span *ngIf="f['username'].errors?.['required']">El usuario es requerido.</span>
					<span *ngIf="f['username'].errors?.['minlength']">Mínimo 3 caracteres.</span>
				</small>
			</div>

			<div class="form-group">
				<label for="password">Contraseña</label>
				<div class="input-group">
					<input id="password" [type]="mostrarPassword ? 'text' : 'password'" formControlName="password"
								 placeholder="Ingrese su contraseña" [attr.aria-invalid]="f['password'].invalid && f['password'].touched" />
					<button type="button" class="btn-toggle" (click)="toggleMostrarPassword()" aria-label="Mostrar contraseña">
						{{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
					</button>
				</div>
				<small class="error" *ngIf="f['password'].touched && f['password'].invalid">
					<span *ngIf="f['password'].errors?.['required']">La contraseña es requerida.</span>
					<span *ngIf="f['password'].errors?.['minlength']">Mínimo 6 caracteres.</span>
				</small>
			</div>

			<div class="form-row">
				<label class="checkbox">
					<input type="checkbox" formControlName="recordarSesion" />
					<span>Recordar sesión</span>
				</label>

				<a href="#" class="forgot" (click)="onForgotPassword($event)">¿Olvidó la contraseña?</a>
			</div>

			<button class="btn btn-primary" type="submit" [disabled]="isLoading || loginForm.invalid">
				<span *ngIf="!isLoading">Iniciar sesión</span>
				<span *ngIf="isLoading">Autenticando...</span>
			</button>
		</form>

		<footer class="login-footer">
			<small>¿No tienes cuenta? Contacta con el administrador.</small>
		</footer>
	</div>

	<ngx-spinner bdColor="rgba(0,0,0,0.6)" size="medium" color="#fff" type="ball-spin-clockwise"></ngx-spinner>
</div>
