<div class="reset-container">
  <h2>Restablecer contraseña</h2>

  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Nueva contraseña</label>
      <div class="input-wrapper">
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          formControlName="newPassword"
          placeholder="Nueva contraseña"
        />
        <button type="button" (click)="togglePassword('new')">
          {{ mostrarPassword ? '👁️' : '🙈' }}
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Confirmar contraseña</label>
      <div class="input-wrapper">
        <input
          [type]="mostrarPassword2 ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirmar contraseña"
        />
        <button type="button" (click)="togglePassword('confirm')">
          {{ mostrarPassword2 ? '👁️' : '🙈' }}
        </button>
      </div>
    </div>

    <p *ngIf="!passwordsMatch()" class="error">
      Las contraseñas no coinciden.
    </p>

    <button type="submit" class="btn-enviar">Actualizar contraseña</button>

  </form>
</div>
