<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Registro de Pacientes" [options]="false">
      <form [formGroup]="pacienteForm" (ngSubmit)="guardarPaciente()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombres *</label>
            <input type="text" class="form-control" formControlName="nombres" placeholder="Ej: Juan">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos *</label>
            <input type="text" class="form-control" formControlName="apellidos" placeholder="Ej: Pérez">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Documento *</label>
            <input type="text" class="form-control" formControlName="numeroDocumento">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Fecha Nacimiento *</label>
            <input type="date" class="form-control" formControlName="fechaNacimiento">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" formControlName="telefono">
          </div>
          <div class="col-md-12 mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" formControlName="direccion">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Paciente</button>
      </form>
    </app-card>
  </div>

  <div class="col-sm-12 mt-4">
    <app-card cardTitle="Listado de Pacientes" [options]="false">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Documento</th>
              <th>Nombre Completo</th>
              <th>Fecha Nacimiento</th>
              <th>Teléfono</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of pacientes">
              <td>{{ p.numeroDocumento }}</td>
              <td>{{ p.nombres }} {{ p.apellidos }}</td>
              <td>{{ p.fechaNacimiento | date:'shortDate' }}</td>
              <td>{{ p.telefono }}</td>
            </tr>
            <tr *ngIf="pacientes.length === 0">
              <td colspan="4" class="text-center">No hay pacientes registrados</td>
            </tr>
          </tbody>
        </table>
      </div>
    </app-card>
  </div>
</div>
