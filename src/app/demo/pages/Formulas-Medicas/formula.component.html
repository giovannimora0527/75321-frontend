<div class="container">
  <div class="card">
    <div class="card-header">
      <h3 class="mb-0">
        <i class="fa fa-user-md"></i>
        &nbsp;Lista de medicos
      </h3>
      <small>Estos son los medicos registrados en el sistema.</small>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Id de la cita</th>
              <th>Id del medicamento</th>
              <th>Dosis</th>
              <th>Indicaciones</th>
              <th>Fecha de registro</th>
              
            </tr>
          </thead>
          <tbody *ngIf="formulaList.length > 0">
            <tr *ngFor="let m of formulaList">
              <td>{{ m.id }}</td>
              <td>{{ m.citaId }}</td>
              <td>{{ m.medicamentoId }}</td>
              <td>{{ m.dosis }}</td>
              <td>{{ m.indicaciones }}</td>
              <td>{{ m.fechaCreacionRegistro }}</td>

               <td>
                <button class="btn btn-outline-primary" data-bs-toggle="tooltip" data-bs-placement="top" title="Editar médico">
                  <i class="fa fa-edit"></i></button>
              </td>
            </tr>
          </tbody>
          <tbody *ngIf="formulaList.length === 0">
            <tr>
              <td colspan="8" class="text-center">No hay medicos disponibles.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
