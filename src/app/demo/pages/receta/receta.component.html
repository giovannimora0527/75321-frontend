<div class="container">
  <div class="card">
    <div class="card-header">
      <h3 class="mb-0">
        <i class="fa fa-user-md"></i>
        &nbsp;Lista de recetas
      </h3>
      <small>Estos son los recetas registradas en el sistema.</small>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Id cita</th>
              <th>Id medicamento</th>
              <th>Dosis</th>
              <th>Indicaciones</th>
              <th>Fecha de creación</th>
            </tr>
          </thead>
          <tbody *ngIf="recetaList.length > 0">
            <tr *ngFor="let m of recetaList">
              <td>{{ m.id }}</td>
              <td>{{ m.cita_id }}</td>
              <td>{{ m.medicamento_id }}</td>
              <td>{{ m.dosis }}</td>
              <td>{{ m.indiciaciones }}</td>
              <td>{{ m.fecha_creacion_resgistro }}</td>
               <td>
                <button class="btn btn-outline-primary" data-bs-toggle="tooltip" data-bs-placement="top" title="Editar receta">
                  <i class="fa fa-edit"></i></button>
              </td>
            </tr>
          </tbody>
          <tbody *ngIf="recetaList.length === 0">
            <tr>
              <td colspan="8" class="text-center">No hay recetas disponibles.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
